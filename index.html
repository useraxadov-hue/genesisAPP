<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tizimga kirish</title>
    <!-- Telegram Web App API kutubxonasi -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 350px;
        }
        h2 { margin-bottom: 15px; color: #1a202c; font-size: 22px; }
        p { color: #718096; margin-bottom: 25px; font-size: 15px; }
        .btn {
            display: inline-block;
            background: linear-gradient(90deg, #0088cc 0%, #005580 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.3);
        }
        .btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="container">
        <h2>Xush kelibsiz!</h2>
        <p>Ilovani ochish uchun quyidagi tugmani bosing.</p>
        
        <!-- Foydalanuvchi bosishi shart bo'lgan tugma -->
        <button class="btn" onclick="openApp()">Ilovaga kirish</button>
    </div>

    <script>
        // Telegram Web App ni ishga tushirish
        Telegram.WebApp.ready();
        
        // Katta qilib ochish
        Telegram.WebApp.expand();

        function openApp() {
            // 1. Telegramdan foydalanuvchi ID sini olish
            let userId = Telegram.WebApp.initDataUnsafe?.user?.id;

            // Agar olinmasa, default ID (test uchun)
            if (!userId) {
                userId = "123456"; 
            }

            // 2. GitHub sahifangiz havolasi
            const targetUrl = "https://useraxadov-hue.github.io/genesisopenapp/?userid=" + userId;

            // 3. Tashqi brauzerda ochish (Tugma bosilganda ishlagani uchun bloklanmaydi)
            Telegram.WebApp.openLink(targetUrl);
        }
    </script>
</body>
</html>
